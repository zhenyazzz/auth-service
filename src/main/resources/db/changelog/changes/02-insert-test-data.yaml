databaseChangeLog:
  - changeSet:
      id: 02-insert-test-data-role-user
      author: auth-service
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM roles WHERE name = 'ROLE_USER'
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: id
                  value: 00000000-0000-0000-0000-000000000001
              - column:
                  name: name
                  value: ROLE_USER

