services:
  auth-service-postgresql:
    image: postgres:18
    container_name: auth-service-db
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_service_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_service_secret}
    ports:
      - "5432:5432"
    volumes:
      - auth-service-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_service} -d ${POSTGRES_DB:-auth_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: auth-service-redis
    ports:
      - "6379:6379"
    volumes:
      - auth-service-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service-app
    ports:
      - "${AUTH_SERVICE_PORT:-8080}:8082"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://auth-service-postgresql:5432/auth_service_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-auth_service}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-auth_service_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      auth-service-postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  auth-service-db-data:
  auth-service-redis-data:
